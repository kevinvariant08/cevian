name: Validate problems

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The gate's Python dependencies, for the review-server test that runs the real gate
        run: pip install -r pipeline/verify/requirements.txt
      - run: node scripts/validate.mjs
      - name: Drafts must never be committed, because Pages serves this repo
        run: test -z "$(git ls-files review)"
      - run: node --test scripts/review-server.test.mjs
